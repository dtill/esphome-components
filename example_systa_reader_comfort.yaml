substitutions:
  # Adjust to your setup
  uart_rx_pin: GPIO16
  uart_tx_pin: GPIO17

esphome:
  name: systa-comfort-reader
  friendly_name: "Systa Comfort Reader"

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:
  level: DEBUG

# Enable UART
uart:
  id: uart_bus
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 19200
  stop_bits: 1

# Systa Reader Component
systa_reader:
  uart_id: uart_bus
  systa_device: [comfort]  # Enable Comfort device (0C02 frames)

sensor:

  # Comfort Sensors
  - platform: systa_reader
    systa_reader_id: systa_bus_01
    kind: comfort_ti_s
    name: "Comfort TI-Soll"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
  - platform: systa_reader
    systa_reader_id: systa_bus_01
    kind: comfort_ti2_s
    name: "Comfort TI2-Soll"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
  - platform: systa_reader
    systa_reader_id: systa_bus_01
    kind: comfort_tv_s
    name: "Comfort TV-Soll"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
  - platform: systa_reader
    systa_reader_id: systa_bus_01
    kind: comfort_tv2_s
